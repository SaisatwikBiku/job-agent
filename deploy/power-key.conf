# logind drop-in: a short press of the power button does nothing, so pressing it to wake the
# blanked screen can't shut the server down (it did, 2026-10-03). Hold it about 5 seconds to
# power off cleanly. Any other key wakes the screen.
# Install: /etc/systemd/logind.conf.d/power-key.conf, then: sudo systemctl kill -s HUP systemd-logind
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
