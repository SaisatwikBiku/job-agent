# Drop-in for apt-daily-upgrade.timer: install updates at 18:00 UTC (2 pm in Albany in
# summer, 1 pm in winter) instead of 06:00-07:00 UTC, which fell inside the nightly job
# search. An OpenSSL update there restarted agent-web mid-search on 2026-10-01.
# Install: /etc/systemd/system/apt-daily-upgrade.timer.d/time.conf
[Timer]
OnCalendar=
OnCalendar=*-*-* 18:00
RandomizedDelaySec=30m
